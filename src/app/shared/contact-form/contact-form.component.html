<div class="contact-wrapper">

  <!-- Contact Info Card -->

    <h3>معلومات التواصل السريع</h3>
    <p>يسعدنا دائماً استقبال استفساراتكم وزيارتكم في أي من فروعنا.</p>
    <div class="info-item">
      <span class="info-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#gymEmeraldGradPin)" xmlns="http://www.w3.org/2000/svg" style="display: block;">
          <defs>
            <linearGradient id="gymEmeraldGradPin" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <path fill-rule="evenodd" d="m11.54 22.351.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.975 16.975 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 0 0-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 0 0 2.682 2.282 16.975 16.975 0 0 0 1.145.742ZM12 13.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
        </svg>
      </span>
      <div>
        <strong>المقر الرئيسي:</strong>
        <p>شارع التسعين الشمالي، التجمع الخامس، القاهرة</p>
      </div>
    </div>
    <div class="info-item">
      <span class="info-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#gymEmeraldGradPhone)" xmlns="http://www.w3.org/2000/svg" style="display: block;">
          <defs>
            <linearGradient id="gymEmeraldGradPhone" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.251.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
        </svg>
      </span>
      <div>
        <strong>الخط الساخن:</strong>
        <p dir="ltr"><a href="tel:+201001234567">+20 100 123 4567 / 19890</a></p>
      </div>
    </div>
    <div class="info-item">
      <span class="info-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#gymEmeraldGradMail)" xmlns="http://www.w3.org/2000/svg" style="display: block;">
          <defs>
            <linearGradient id="gymEmeraldGradMail" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
          <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
        </svg>
      </span>
      <div>
        <strong>البريد الإلكتروني:</strong>
        <p><a href="mailto:support@gym-management.com">support@gym-management.com</a></p>
      </div>
    </div>
  </div>

  <!-- Contact Form -->
  <form class="contact-form-card" (ngSubmit)="handleSubmit()">
    <h3>نموذج الاستفسار والاشتراك</h3>

    <div class="form-group">
      <label for="c-name">الاسم بالكامل</label>
      <input
        id="c-name"
        type="text"
        [(ngModel)]="contactForm.name"
        name="name"
        placeholder="أحمد محمد"
        required
      />
    </div>

    <div class="form-group">
      <label for="c-phone">رقم الهاتف / الواتساب</label>
      <input
        id="c-phone"
        type="tel"
        [(ngModel)]="contactForm.phone"
        name="phone"
        placeholder="01012345678"
        required
      />
    </div>

    <div class="form-group">
      <label for="c-branch">الفرع المفضل</label>
      <select id="c-branch" [(ngModel)]="contactForm.branch" name="branch">
        <option value="الفرع الرئيسي - التجمع">الفرع الرئيسي - التجمع الخامس</option>
        <option value="فرع الشيخ زايد">فرع الشيخ زايد - بيفرلي هيلز</option>
        <option value="فرع المعادي">فرع المعادي - دجلة</option>
      </select>
    </div>

    <div class="form-group">
      <label for="c-msg">ملاحظات أو استفسار إضافي</label>
      <textarea
        id="c-msg"
        rows="3"
        [(ngModel)]="contactForm.message"
        name="message"
        placeholder="أرغب في الاستفسار عن باقة الـ 3 أشهر..."
      ></textarea>
    </div>

    <button type="submit" class="submit-form-btn">إرسال الطلب الآن</button>
  </form>

</div>
